<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetriFlow</title>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fe;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #dbe3f5;
      --accent: #2250df;
      --accent-dark: #1b43b8;
      --tint: #e8eeff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141b;
        --card: #1b1e28;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --line: #2d3345;
        --accent: #4f7bff;
        --accent-dark: #3d68e6;
        --tint: #232a40;
      }
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: "Figtree", system-ui, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo { flex: none; width: 40px; height: 40px; }

    h1 {
      margin: 0;
      font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .head p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .menu { display: grid; gap: 8px; margin-bottom: 10px; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      font: inherit;
      text-align: left;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .item:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 6px 16px rgba(34, 80, 223, 0.15);
    }

    .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .ico {
      display: grid;
      place-items: center;
      flex: none;
      width: 38px;
      height: 38px;
      color: var(--accent);
      background: var(--tint);
      border-radius: 11px;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .txt { display: grid; flex: 1; gap: 1px; }
    .txt strong { font-size: 14.5px; font-weight: 700; }
    .txt small { font-size: 12px; color: var(--muted); }

    .chev { width: 18px; height: 18px; color: var(--muted); }

    .cta { color: #ffffff; background: var(--accent); border-color: var(--accent); }
    .cta .txt small { color: rgba(255, 255, 255, 0.82); }
    .cta:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    .ext { color: #ffffff; }

    footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="head">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#16a3b8"/>
          <stop offset="1" stop-color="#2250df"/>
        </linearGradient>
      </defs>
      <rect width="40" height="40" rx="10" fill="url(#lg)"/>
      <rect x="9" y="9" width="22" height="5" rx="2.5" fill="#ffffff"/>
      <path d="M12 21h4M14 19v4M24 21h4M12 29h16M24 26l4 3-4 3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>MetriFlow</h1>
      <p>Calculator &amp; unit converter</p>
    </div>
  </header>

  <nav class="menu">
    <button type="button" class="item" data-mode="window" data-page="assets/pages/calculator.html">
      <span class="ico"><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg></span>
      <span class="txt"><strong>Calculator</strong><small>Scientific, 25+ functions</small></span>
      <svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <button type="button" class="item" data-mode="window" data-page="assets/pages/converter.html">
      <span class="ico"><svg class="icon" viewBox="0 0 24 24"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg></span>
      <span class="txt"><strong>Unit Converter</strong><small>30 categories, 440+ units</small></span>
      <svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <button type="button" class="item" data-mode="window" data-page="assets/pages/about.html">
      <span class="ico"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>
      <span class="txt"><strong>About</strong><small>How it works &amp; privacy</small></span>
      <svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </nav>

  <button type="button" class="item cta" data-mode="tab" data-url="https://codinglaks.github.io/MetriFlow/">
    <span class="txt"><strong>Open full site</strong><small>Opens in a new tab</small></span>
    <svg class="icon ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
  </button>

  <footer>Private · No tracking · Works on your device</footer>

  <script>
    (function () {
      "use strict";

      var inExtension = typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.id;

      function pageUrl(path) {
        if (inExtension) { return chrome.runtime.getURL(path); }
        return new URL(path, window.location.href).href;
      }

      function openTab(url) {
        if (inExtension && chrome.tabs) {
          chrome.tabs.create({ url: url });
        } else {
          window.open(url, "_blank", "noopener");
        }
      }

      function openWindow(url) {
        if (inExtension && chrome.windows) {
          chrome.windows.create({ url: url, type: "popup", width: 430, height: 720 });
        } else {
          window.open(url, "_blank", "popup,width=430,height=720");
        }
      }

      document.querySelectorAll(".item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (btn.dataset.mode === "tab") {
            openTab(btn.dataset.url);
          } else {
            openWindow(pageUrl(btn.dataset.page));
          }
          if (inExtension) { window.close(); }
        });
      });
    })();
  </script>
</body>
</html>
